{% extends "base.html" %}
{% block content %}
    <h2>Add Tweet</h2>
    <form method="post">
        {% csrf_token %}
        <label for="content">Content:</label><br>
        <textarea id="content" name="content" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Add Tweet">
    </form>
{% endblock %}
