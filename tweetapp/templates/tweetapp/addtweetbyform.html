{% extends "base.html" %}

{% block content %}
    <h2>Add Tweet BY FORM</h2>
    <form action="" method="POST">
    {% csrf_token %}
    
    {% for field in form %}
    
    <div class="form-control">
    {{ field.label_tag }}
    {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Send Tweet</button>
    </form>
{% endblock %}
