{%extends "base.html"%}

{%block content%}
<h2>List Tweet</h2>

    <div class="container" style="width: 50%;">
    {%for tweet in tweets%}
        <div class="card " style="padding:10px;">
            <div class="card-header" style = "background-color: aquamarine;">
                {{tweet.nickname}}
            </div>
            <div class = "card-body">
                <p class="card-text">{{tweet.message}}</p>
            </div>
        </div>
    {%endfor%}
    </div>

{%endblock%}
