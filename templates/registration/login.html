{% extends "base.html" %}

{% block content %}
{%if form.errors %}
    <p>Your username or password is incorrect.</p>
{% endif %}

{%if user.is_authenticated%}
<h2>Welcome {{ user.username }}</h2>
{%else%}

<div class="container" style="border: 4px solid cadetblue; padding :8px;">
<form method="POST" action="{% url 'login' %}">
{%csrf_token%}
{%for field in form%}
<div class="mb-3">
    {{field.label_tag}}
    {{field}}
</div>
{%endfor%}
<button type="submit" class="btn btn-primary">Login</button>
</form>
</div>
{%endif%}
{% endblock %}
